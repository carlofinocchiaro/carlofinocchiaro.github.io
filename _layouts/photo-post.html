---
layout: default
---

<article class="photo-post">

    {% include meta.html post=page %}

    {% if page.content %}
    <section class="photo-post-content">
        {{ content }}
    </section>
    {% endif %}

    {% if page.images %}
    <section class="photo-gallery">
        {% for img in page.images %}
        <figure class="photo-item">
            <img src="{{ img | relative_url }}" alt="{{ page.title | escape }}, foto {{ forloop.index }}" loading="lazy" tabindex="0" role="button" aria-haspopup="dialog">
        </figure>
        {% endfor %}
    </section>
    {% endif %}

</article>

<div id="lightbox" role="dialog" aria-modal="true" aria-label="Anteprima immagine" aria-hidden="true">
    <button type="button" class="lightbox-close" aria-label="Chiudi anteprima">&times;</button>
    <img src="" alt="">
</div>

<script src="{{ "/assets/js/photo-lightbox.js" | relative_url }}" defer></script>
